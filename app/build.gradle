plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.surgutperevalka.armetl'
    compileSdk 34

    defaultConfig {
        applicationId "ru.surgutperevalka.armetl"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the Kotlin standard-library family on one version. AppCompat's
// transitive graph can otherwise combine 1.8.x stdlib with the legacy
// 1.6.x jdk7/jdk8 artifacts, which causes duplicate classes at APK build time.
configurations.configureEach {
    resolutionStrategy.force(
        'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    )
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
